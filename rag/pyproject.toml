[project]
name = "ekrs-rag"
version = "0.6.0"
description = "EKRS RAG service — ingestion, retrieval, constraint solving"
requires-python = ">=3.11"
dependencies = [
    "ekrs-shared",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "qdrant-client>=1.11",
    "redis>=5.0",
    "aiosqlite",
    "tenacity>=8.2",
    "python-json-logger>=2.0",
    "prometheus-client>=0.20",
    "httpx",
    "pydantic-settings>=2.0",
    # Phase 6B — bge-m3 embedding via vanilla ONNX export
    "onnxruntime>=1.15.0,<1.18.0",
    "transformers>=4.37,<6.0",
    "tokenizers>=0.15",
    "numpy>=1.24.0,<2.0.0",
    # Phase 10 T10d — MCP (Model Context Protocol) SDK. stdio transport
    # for AI Agent (Claude Code / MCP inspector) integration.
    "mcp>=1.0",
    # Phase 13a T4 — pebble subprocess pool for Step5 encode workers
    # (P0-2/P0-3 production-readiness). Version cap <6 because pebble
    # 6.x changed the ProcessPool API.
    "pebble>=5.0,<6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ekrs_rag*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "httpx",  # for TestClient async
    "fakeredis>=2.20",
    # T5 (Phase 7, Decision §2): dev-only Streamlit UI. Folded into rag/
    # extras so production Docker images stay slim. Install with
    # `pip install -e rag[dev]` then run `streamlit run dev_ui/app.py`.
    "streamlit>=1.30",
]
# Phase 13b T3 — torch FP16 GPU encoder (eng-review UQ-5 decision).
# CPU-only install: `pip install -e rag/`. GPU install: `pip install -e rag/[gpu]`.
# Runtime: lazy import in torch_bge_m3.py handles missing-torch gracefully
# (ImportError → EncodingRouter.try_register_gpu returns False → CPU fallback).
gpu = [
    "torch>=2.1,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "heavy: marks tests as heavy (require real bge-m3 model, run in nightly job only)",
    # Phase 10 T10d — MCP stdio round-trip test spawns a subprocess
    "integration: marks tests that spawn subprocesses or use real infra",
]
