# Phase 11 T11-4 — nginx config for dev_ui_v2.
#
# Three responsibilities:
#   1. Serve the static SPA bundle from /usr/share/nginx/html
#   2. SPA fallback: any unmatched path returns index.html (React Router 6
#      handles client-side routing for /ingest, /constraints, etc.)
#   3. Reverse proxy /v1/* and /healthz to the RAG backend service
#      (compose service name `rag`, port 8000 internal)
#
# Note: the MSW service worker (mockServiceWorker.js) is NOT shipped in
# production builds (Vite tree-shakes the dynamic import behind
# import.meta.env.DEV). The nginx config does not need to special-case it.

# Upstream for the RAG backend. `rag` is the docker-compose service name;
# the docker bridge network resolves this on container-to-container DNS.
upstream ekrs_rag {
    server rag:8000;
}

# Cache long-lived static assets (Vite hashes filenames, so safe to cache).
map $sent_http_content_type $cache_control_header {
    application/javascript  "public, max-age=31536000, immutable";
    text/css                "public, max-age=31536000, immutable";
    image/svg+xml           "public, max-age=31536000, immutable";
    application/octet-stream "public, max-age=31536000, immutable";
    default                 "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $cache_control_header;
    }

    # RAG backend proxy — /v1/* + /healthz.
    # Forward IP and protocol so the backend can write correct URLs in
    # response headers (e.g. Location during 201s).
    location /v1/ {
        proxy_pass http://ekrs_rag;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload timeouts — ingestion notify can take a few seconds.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://ekrs_rag/healthz;
        proxy_set_header Host $host;
        access_log off;  # parent healthcheck convention: /healthz not logged
    }

    # SPA fallback: any path that's not a real file → index.html.
    # React Router takes over for /ingest, /constraints, /golden, /overlays.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers — minimal. The SPA is internal-only; a real prod
    # deployment would add CSP, X-Frame-Options, etc.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
